name: Push image to GHCR

on:
  push:
    tags: ["*.*.*.RELEASE"]

env:
  IMAGE: ghcr.io/francis-250/compeleteme

jobs:
  push_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push the image
        run: |
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u Francis-250 --password-stdin
          docker build . --tag $IMAGE:${{ github.ref_name }} --tag $IMAGE:latest
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest